# VoidarisCore - chat, private messages and join formats (MiniMessage).
# Placeholders: <player>, <displayname>, <message>, <prefix_lp>, <suffix_lp>, <target>.
# PlaceholderAPI placeholders (%...%) are resolved when the integration is enabled.
# LuckPerms prefixes and suffixes (<prefix_lp>, <suffix_lp>) are parsed as MiniMessage.

chat:
  # Format for players whose LuckPerms primary group is not listed under groups.
  default-format: "<gray><player></gray> <dark_gray>»</dark_gray> <white><message>"
  groups:
    admin: "<prefix_lp><red><player></red> <dark_gray>»</dark_gray> <white><message>"
    vip: "<prefix_lp><gold><player></gold> <dark_gray>»</dark_gray> <white><message>"
  colors:
    # Legacy & codes require voidaris.chat.color, hex (&#RRGGBB) requires voidaris.chat.hex.
    legacy: true
    hex: true

private-messages:
  sender-format: "<dark_gray>[<light_purple>Tú</light_purple> → <light_purple><target></light_purple>]</dark_gray> <white><message>"
  receiver-format: "<dark_gray>[<light_purple><player></light_purple> → <light_purple>Tú</light_purple>]</dark_gray> <white><message>"
  spy-format: "<dark_gray>[Spy] <gray><player> → <target>:</gray> <white><message>"

join-quit:
  # Quit messages are always hidden. An empty format ("") hides the message. first-join replaces join on a player's first login.
  # join is empty so only players with a format under groups (VIPs and ranks) announce their arrival.
  join: ""
  first-join: "<prefix><light_purple><player></light_purple> <white>entró por primera vez a Voidaris."
  # Each player uses the format with the lowest priority among those they have voidaris.joinquit.<name> for
  # (ties go to the first one listed, formats without priority go last). Players without any use the formats above.
  groups:
    mvp:
      priority: 1
      join: "<dark_gray>[<green>+</green>]</dark_gray> <aqua>MVP <player></aqua> <white>se ha unido."
    vip:
      priority: 2
      join: "<dark_gray>[<green>+</green>]</dark_gray> <gold>VIP <player></gold> <white>se ha unido."
  # Shown when hovering over any join message. Remove all lines to disable it.
  # Extra placeholders: <group> (LuckPerms primary group), <first_join> (formatted with date-format).
  hover:
    date-format: "dd/MM/yyyy"
    lines:
      - "<prefix_lp><white><player>"
      - "<gray>Rango: <white><group>"
      - "<gray>Primera conexión: <white><first_join>"
