# VoidarisCore - teleport settings (spawn, tpa, back).

defaults:
  warmup-seconds: 3
  cancel-on-move: true
  cancel-on-damage: true
  # Players with voidaris.teleport.bypass skip warmup and cooldown.

# Played on every teleport with one of these causes (toggle: modules.teleport-effects in config.yml).
effects:
  # PlayerTeleportEvent causes: COMMAND (/tp, /spawn, /warp...), PLUGIN, ENDER_PEARL, NETHER_PORTAL, END_PORTAL...
  causes: [COMMAND, PLUGIN]
  sound:
    enabled: true
    # Only the teleported player hears it.
    key: "minecraft:entity.enderman.teleport"
    volume: 1.0
    pitch: 1.0
  # Particles are the cosmetic each player equips with /cosmetics teleportparticle (teleport-particles in cosmetics.yml).
  particles:
    # When false, only the teleported player sees them.
    visible-to-others: false

spawn:
  warmup-seconds: 3
  cooldown-seconds: 0
  teleport-on-first-join: true
  teleport-on-respawn: true
  # Respawn at bed/anchor takes priority when true.
  respect-bed-spawn: true
  void-return:
    enabled: true
    # Y level below which the player is sent back to spawn.
    min-y: -70
    # Empty means every world.
    worlds: []

tpa:
  warmup-seconds: 3
  cooldown-seconds: 30
  request-timeout-seconds: 60
  blocked-worlds: []

back:
  enabled: true
  warmup-seconds: 3
  cooldown-seconds: 30
  save-on-death: true
