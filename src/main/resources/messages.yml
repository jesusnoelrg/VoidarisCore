    custom-invalid: "<prefix><white>Tu insignia debe tener entre 1 y <light_purple><max></light_purple> caracteres; los códigos de color como <light_purple>&a</light_purple> no cuentan."
    # Sent when clicking the custom badge icon of the menu. Placeholders: <max>, <custom_badge>.
    custom-hint: "<prefix><white>Escribe <click:suggest_command:'/badges custom '><hover:show_text:'<gray>Clic para autocompletar'><light_purple>/badges custom \\<texto></light_purple></hover></click> <white>con hasta <light_purple><max></light_purple> caracteres. Puedes usar colores como <light_purple>&a</light_purple>, <light_purple>&k</light_purple> o <light_purple>&#FF5555</light_purple>."
  nick-color:
    selected: "<prefix><white>Ahora tu nombre se muestra con el color <cosmetic><white>."
    not-found: "<prefix><white>No existe el color <light_purple><id></light_purple>. Usa un color del menú o un hexadecimal como <light_purple>#FF5555</light_purple>."
    locked: "<prefix><white>No tienes desbloqueado el color <cosmetic><white>."
