  received: "<prefix><white>Has recibido el kit <light_purple><kit></light_purple>."
  # Sent to whoever gave the kit with /kit <kit> <player>.
  given: "<prefix><white>Le diste el kit <light_purple><kit></light_purple> a <light_purple><player></light_purple>."
  not-found: "<prefix><white>No existe el kit <light_purple><kit></light_purple>."
  cooldown: "<prefix><white>Podrás reclamar el kit <light_purple><kit></light_purple> en <light_purple><time></light_purple>."
  already-claimed: "<prefix><white>Ya reclamaste el kit <light_purple><kit></light_purple> y solo puede reclamarse una vez."
  locked: "<prefix><white>No tienes acceso al kit <light_purple><kit></light_purple>."
  inventory-full: "<prefix><white>Algunos ítems no cabían y se soltaron al suelo."
  # Sent instead of giving the kit when drop-when-full is false in kits.yml.
  inventory-full-denied: "<prefix><white>No tienes espacio suficiente para el kit <light_purple><kit></light_purple>. Libera tu inventario e inténtalo de nuevo."
  list-empty: "<prefix><white>No hay kits disponibles."
  # <items> is the number of item stacks saved; <cooldown> as in the menu.
  created: "<prefix><white>Kit <light_purple><kit></light_purple> creado con <light_purple><items></light_purple> ítems y cooldown <light_purple><cooldown></light_purple>. Ajústalo con <light_purple>/editkit <id></light_purple>."
  already-exists: "<prefix><white>Ya existe el kit <light_purple><kit></light_purple>. Usa <light_purple>/editkit <id> items</light_purple> para cambiar sus ítems."
  invalid-name: "<prefix><white>El nombre del kit no es válido."
  empty-inventory: "<prefix><white>Tu inventario está vacío; pon en él los ítems del kit."
  deleted: "<prefix><white>Kit <light_purple><kit></light_purple> eliminado."
  items-updated: "<prefix><white>Ítems del kit <light_purple><kit></light_purple> actualizados (<light_purple><items></light_purple> ítems)."
  icon-set: "<prefix><white>Icono del kit <light_purple><kit></light_purple> cambiado a <light_purple><item></light_purple>."
  icon-empty-hand: "<prefix><white>Debes tener un objeto en la mano."
  display-name-set: "<prefix><white>El kit <light_purple><id></light_purple> ahora se muestra como <light_purple><kit></light_purple><white>."
  display-name-reset: "<prefix><white>El kit <light_purple><id></light_purple> vuelve a mostrarse con su nombre."
  cooldown-set: "<prefix><white>Cooldown del kit <light_purple><kit></light_purple> cambiado a <light_purple><cooldown></light_purple>."
  # <permission> is the node players need.
  permission-enabled: "<prefix><white>El kit <light_purple><kit></light_purple> ahora requiere el permiso <light_purple><permission></light_purple>."
  permission-disabled: "<prefix><white>El kit <light_purple><kit></light_purple> ya no requiere permiso."
  reset: "<prefix><white><light_purple><player></light_purple> puede volver a reclamar el kit <light_purple><kit></light_purple>."
  player-unknown: "<prefix><white>El jugador <light_purple><player></light_purple> nunca ha entrado al servidor."
  # Values of <cooldown> for one-time kits and kits without cooldown.
  cooldown-once: "Único uso"
  cooldown-none: "Sin cooldown"
  # Units of <time> and <cooldown>; only the non-zero ones are shown, joined with the separator.
  time:
    day: "<value>d"
    hour: "<value>h"
    minute: "<value>m"
    second: "<value>s"
    separator: " "

private-messages:
  # /msgtoggle; target-disabled is sent to whoever tries to message a player who turned them off.
  disabled-self: "<prefix><white>Has desactivado los mensajes privados."
  enabled-self: "<prefix><white>Has activado los mensajes privados."
  target-disabled: "<prefix><light_purple><player></light_purple> <white>tiene los mensajes privados desactivados."
  # Shown as <player>, <sender> or <target> when the console sends or receives a private message.
  console-name: "Consola"
  # <player> is the other player (or console-name); <message> is the text typed (plain, no formatting).
  sent: "<dark_gray>[<dark_purple>Yo</dark_purple> » <light_purple><player></light_purple>]</dark_gray> <white><message>"
  # Clicking it fills the chat with /r.
  received: "<hover:show_text:'<gray>Clic para responder a <light_purple><player>'><click:suggest_command:'/r '><dark_gray>[<light_purple><player></light_purple> » <dark_purple>Yo</dark_purple>]</dark_gray> <white><message></click></hover>"
  self: "<prefix><white>No puedes enviarte mensajes a ti mismo."
  blocked: "<prefix><white>No puedes enviarle mensajes privados a <light_purple><player></light_purple> porque te tiene ignorado."
  no-reply: "<prefix><white>No tienes a quién responder."
  player-unknown: "<prefix><white>El jugador <light_purple><player></light_purple> nunca ha entrado al servidor."
  ignored: "<prefix><white>Ahora ignoras los mensajes privados de <light_purple><player></light_purple>."
  unignored: "<prefix><white>Ya no ignoras a <light_purple><player></light_purple>."
  super-ignored: "<prefix><white>Ahora ignoras a <light_purple><player></light_purple> en el chat y en los mensajes privados."
  super-unignored: "<prefix><white>Ya no ignoras a <light_purple><player></light_purple> en el chat ni en los mensajes privados."
  already-super-ignored: "<prefix><white>Ya ignoras a <light_purple><player></light_purple> en todo. Usa <light_purple>/superignore <player></light_purple> para dejar de ignorarlo."
  ignore-self: "<prefix><white>No puedes ignorarte a ti mismo."
  ignore-list:
    # <page> and <pages> are the current page and the page count.
    header: "<prefix><white>Jugadores ignorados <dark_gray>(<light_purple><page></light_purple>/<light_purple><pages></light_purple>)"
    # Clicking an entry stops ignoring the player.
    entry: "<dark_gray> ▪ <light_purple><player></light_purple> <dark_gray>- <scope>"
    scope-private: "<gray>Mensajes privados"
    scope-all: "<red>Ignorado en todo (chat y privados)"
    hover: "<gray>Clic para dejar de ignorar a <light_purple><player>"
    empty: "<prefix><white>No ignoras a ningún jugador."
  spy-enabled: "<prefix><white>Modo espía activado."
  spy-disabled: "<prefix><white>Modo espía desactivado."
  # <sender> wrote <message> to <target>.
  spy-format: "<dark_gray>[<red>Espía</red>] <gray><sender> <dark_gray>»</dark_gray> <gray><target><dark_gray>:</dark_gray> <white><message>"

chat:
  muted: "<prefix><white>El chat está silenciado."

cosmetics:
