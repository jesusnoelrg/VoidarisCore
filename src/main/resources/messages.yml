# VoidarisCore - player-facing messages (MiniMessage).
# <prefix> is replaced with the value of "prefix" in every message.

config-version: 2

prefix: "<dark_purple><bold>Voidaris</bold> <dark_gray><bold>»</bold> "

general:
  no-permission: "<prefix><white>No tienes permiso para hacer eso."
  player-only: "<prefix><white>Este comando solo puede usarlo un jugador."
  player-not-found: "<prefix><white>El jugador <light_purple><player></light_purple> no está conectado."
  reloaded: "<prefix><white>Configuración recargada."
  module-disabled: "<prefix><white>Este módulo está desactivado."
  # Sent when a command is missing arguments or one is invalid; clicking it fills the command in the chat.
  usage: "<prefix><white>Uso correcto: <light_purple><command></light_purple> <gray><arguments></gray><white>. Usa <light_purple>/voidaris help</light_purple> para ver todos los comandos."

commands:
