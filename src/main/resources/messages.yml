    custom-selected: "<prefix><white>Ahora tu nombre se muestra con el color <color><white>."
    custom-locked: "<prefix><white>No tienes desbloqueados los colores de nick personalizados."
    # Sent when clicking the custom color icon of the menu.
    custom-hint: "<prefix><white>Escribe <click:suggest_command:'/nickcolor #'><hover:show_text:'<gray>Clic para autocompletar'><light_purple>/nickcolor #RRGGBB</light_purple></hover></click> <white>con el color que quieras, por ejemplo <#FF5555>#FF5555</#FF5555><white>."

