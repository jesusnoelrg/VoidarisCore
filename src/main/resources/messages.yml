    selected: "<prefix><white>Ahora escribes en el chat con el color <cosmetic><white>."
    not-found: "<prefix><white>No existe el color <light_purple><id></light_purple>. Usa un color del menú o un hexadecimal como <light_purple>#FF5555</light_purple>."
    locked: "<prefix><white>No tienes desbloqueado el color <cosmetic><white>."
    # <color> is the hex color written in that color.
    custom-selected: "<prefix><white>Ahora escribes en el chat con el color <color><white>."
    custom-locked: "<prefix><white>No tienes desbloqueados los colores personalizados."
    # Sent when clicking the custom color icon of the menu.
    custom-hint: "<prefix><white>Escribe <click:suggest_command:'/chatcolor #'><hover:show_text:'<gray>Clic para autocompletar'><light_purple>/chatcolor #RRGGBB</light_purple></hover></click> <white>con el color que quieras, por ejemplo <#FF5555>#FF5555</#FF5555><white>."
    # Sample text shown in each icon of the menu, written in its color.
    preview: "¡Hola, Voidaris!"
  badge:
    selected: "<prefix><white>Equipaste la insignia <cosmetic><white>."
    not-found: "<prefix><white>No existe la insignia <light_purple><id></light_purple>."
    locked: "<prefix><white>No tienes desbloqueada la insignia <cosmetic><white>."
