    # placeholders of chat-format.yml.
    preview: "<preview_badge><white><nickname>"
    # Menu preview of a badge whose format is empty (such as none).
    preview-none: "<gray>No se mostrará ninguna insignia."
    # <custom_badge> is the custom badge as shown.
    custom-selected: "<prefix><white>Equipaste tu insignia <custom_badge><white>."
    custom-locked: "<prefix><white>No tienes desbloqueadas las insignias personalizadas."
