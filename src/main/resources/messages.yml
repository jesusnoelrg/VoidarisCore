help:
  # <page> and <pages> are the current page and the page count.
  header: "<prefix><white>Comandos disponibles <dark_gray>(<light_purple><page></light_purple>/<light_purple><pages></light_purple>)"
  section:
    player: "<dark_purple><bold>» Generales"
    admin: "<red><bold>» Administración"
  # <arguments> is empty for commands without arguments; otherwise it already starts with a space.
  entry: "<dark_gray> ▪ <light_purple><command></light_purple><gray><arguments></gray> <dark_gray>- <white><description>"
  hover:
    run: "<gray>Clic para ejecutar"
    suggest: "<gray>Clic para autocompletar"
    page: "<gray>Ir a la página <light_purple><page>"
  # Only shown when there is more than one page.
  footer: "<dark_gray>       <previous> <dark_gray>| <gray>Página <light_purple><page></light_purple>/<light_purple><pages></light_purple> <dark_gray>| <next>"
  previous: "<light_purple>« Anterior"
  previous-unavailable: "<dark_gray>« Anterior"
  next: "<light_purple>Siguiente »"
  next-unavailable: "<dark_gray>Siguiente »"
  invalid-page: "<prefix><white>La página <light_purple><page></light_purple> no existe. Hay <light_purple><pages></light_purple> en total."
  commands:
    voidaris-help:
      arguments: "[página]"
      description: "Muestra esta ayuda"
    voidaris-reload:
      description: "Recarga la configuración del plugin"
    cosmetics:
      description: "Abre el menú de cosméticos"
    cosmetics-joinmessage:
      arguments: "\\<cosmético>"
      description: "Equipa un mensaje de entrada"
    cosmetics-teleportparticle:
      arguments: "[partícula]"
      description: "Equipa unas partículas de teletransporte"
    cosmetics-killmessage:
      arguments: "[cosmético]"
      description: "Equipa un mensaje de asesinato"
    cosmetics-aura:
      arguments: "[aura]"
      description: "Equipa un aura de rastro"
    cosmetics-joineffect:
      arguments: "[efecto]"
      description: "Equipa un efecto de entrada"
    chatcolor:
      arguments: "[color|#RRGGBB]"
      description: "Elige el color con el que escribes en el chat"
    nickcolor:
      arguments: "[color|#RRGGBB]"
      description: "Elige el color de tu nombre"
    badges:
      arguments: "[insignia]"
      description: "Elige la insignia que se muestra junto a tu nombre"
    badges-custom:
      arguments: "\\<texto>"
      description: "Crea y equipa tu propia insignia (los códigos de color no cuentan)"
    spawn:
      description: "Teletranspórtate al spawn"
    setspawn:
      description: "Establece el spawn en tu posición"
    delspawn:
      description: "Elimina el spawn"
    home:
      arguments: "[home]"
      description: "Teletranspórtate a una de tus homes"
    sethome:
      arguments: "[home]"
      description: "Establece una home en tu posición"
    delhome:
      arguments: "\\<home>"
      description: "Elimina una de tus homes"
    listhome:
      description: "Abre el listado de tus homes (también /homes)"
    home-seticon:
      arguments: "\\<home> seticon"
      description: "Usa el objeto de tu mano como icono de la home"
    # Shared by the admin variants of /home, /sethome and /delhome.
    homes-others:
      arguments: "\\<home> \\<jugador>"
    home-others:
      description: "Teletranspórtate a la home de un jugador"
    sethome-others:
      description: "Establece una home de un jugador en tu posición"
    delhome-others:
      description: "Elimina una home de un jugador"
    listhome-others:
      arguments: "\\<jugador>"
      description: "Abre el listado de homes de un jugador"
    warp:
      arguments: "[warp]"
      description: "Lista los warps o teletranspórtate a uno"
    setwarp:
      arguments: "\\<warp>"
      description: "Crea o mueve un warp a tu posición"
    delwarp:
      arguments: "\\<warp>"
      description: "Elimina un warp"
    kit:
      arguments: "[kit]"
      description: "Abre el menú de kits o reclama uno (también /kits)"
    kit-give:
      arguments: "\\<kit> \\<jugador>"
      description: "Da un kit a un jugador sin cooldown ni permiso (también por consola)"
    createkit:
      arguments: "\\<kit>"
      description: "Crea un kit con tu inventario, armadura y mano secundaria"
    editkit:
      arguments: "\\<kit> \\<items|icon|displayname|cooldown|permission|reset>"
      description: "Cambia los ítems, el icono, el nombre visible, el cooldown o el permiso de un kit, o reinicia el reclamo de un jugador"
    # Only shown in the usage message of each /editkit option.
    editkit-cooldown:
      arguments: "\\<kit> cooldown \\<0|once|30m|1h30m|7d>"
    editkit-displayname:
      arguments: "\\<kit> displayname \\<nombre|reset>"
    editkit-permission:
      arguments: "\\<kit> permission \\<true|false>"
    editkit-reset:
      arguments: "\\<kit> reset \\<jugador>"
    delkit:
      arguments: "\\<kit>"
      description: "Elimina un kit"
    # Shared by every utilities command that accepts an optional target.
    utilities-target:
      arguments: "[jugador]"
    craft:
      description: "Abre una mesa de trabajo"
    anvil:
      description: "Abre un yunque"
    grindstone:
      description: "Abre una piedra de afilar"
    stonecutter:
      description: "Abre un cortapiedras"
    loom:
      description: "Abre un telar"
    cartography:
      description: "Abre una mesa de cartografía"
    smithing:
      description: "Abre una mesa de herrería"
    enderchest:
      description: "Abre tu cofre de ender o el de otro jugador"
    invsee:
      arguments: "\\<jugador>"
      description: "Mira el inventario de un jugador (editable con voidaris.utilities.invsee.modify)"
    gm:
      arguments: "\\<modo|0-3> [jugador]"
      description: "Cambia tu modo de juego o el de otro jugador"
    heal:
      description: "Restaura la vida y el hambre"
    feed:
      description: "Restaura el hambre"
    fly:
      description: "Activa o desactiva el vuelo"
    god:
      description: "Activa o desactiva la invulnerabilidad"
    speed:
      arguments: "\\<0-10> [jugador]"
      description: "Velocidad de caminar o volar (1 es la normal)"
    hat:
      description: "Ponte el ítem de tu mano como sombrero"
    repair:
      arguments: "[all]"
      description: "Repara el ítem de tu mano, o todo tu inventario con all (también /fix)"
    clear:
      description: "Vacía el inventario, armadura incluida (también /ci)"
    ping:
      description: "Muestra tu ping o el de otro jugador"
    top:
      description: "Teletranspórtate al bloque más alto sobre ti"
    day:
      description: "Hace de día en tu mundo"
    night:
      description: "Hace de noche en tu mundo"
    sun:
      description: "Despeja el clima de tu mundo"
    rain:
      description: "Hace llover en tu mundo"
    time:
      arguments: "\\<day|noon|night|midnight|0-23999>"
      description: "Cambia la hora de tu mundo"
    weather:
      arguments: "\\<sun|rain|thunder>"
      description: "Cambia el clima de tu mundo"
    motd:
      description: "Muestra el mensaje de bienvenida"
    message:
      arguments: "\\<jugador> \\<mensaje>"
      description: "Envía un mensaje privado (también /msg y /tell)"
    reply:
      arguments: "\\<mensaje>"
      description: "Responde al último mensaje privado (también /r)"
    # Shared by /ignore and /superignore.
    ignore:
      arguments: "\\<jugador>"
      description: "Ignora o deja de ignorar los mensajes privados de un jugador"
    superignore:
      description: "Ignora o deja de ignorar a un jugador en el chat y en privado"
    # Only shown in the usage message; the /voidaris help line runs /listignore directly.
    listignore:
      arguments: "[página]"
      description: "Lista los jugadores que ignoras"
    spy:
      description: "Activa o desactiva el modo espía de mensajes privados"
    msgtoggle:
      description: "Activa o desactiva la recepción de mensajes privados"
    announcetoggle:
      description: "Activa o desactiva la recepción de anuncios automáticos"

