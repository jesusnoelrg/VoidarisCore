# VoidarisCore - cosmetics (MiniMessage).
# Players equip cosmetics with /cosmetics. Only the equipped choice is stored (in the database), so the database
# must be enabled in database.yml; without it every player uses the default selection.

join-messages:
  # Each cosmetic is unlocked with voidaris.cosmetics.joinmessage.<id> (give it to ranks in LuckPerms).
  # Players who never picked one, or lost the one they picked, use this cosmetic if they own it, and no message otherwise.
  default-selection: default
  # name: shown in /cosmetics joinmessage. format: the join message; an empty format ("") hides the join.
  # Formats support the placeholders of chat-format.yml (<player>, <displayname>, <prefix_lp>, <suffix_lp>, PlaceholderAPI).
  # seasons: optional formats that replace format between two dates (MM-dd, inclusive, may wrap around the new year).
  # The first active season wins; a cosmetic with no active season and no format cannot be equipped or shown.
  cosmetics:
    silent:
      name: "<gray>Silencioso"
      format: ""
    default:
      name: "<white>Predeterminado"
      format: "<dark_gray>[<green>+</green>]</dark_gray> %luckperms_prefix%<white><player> <gray>se ha unido."
    wizard:
      name: "<gradient:#B06AB3:#4568DC>Mago</gradient>"
      format: "<light_purple>✦</light_purple> <gradient:#B06AB3:#4568DC>Con un destello arcano, <player> se materializó en Voidaris.</gradient>"
    fire:
      name: "<gradient:#FFE259:#FF4E00>Fuego</gradient>"
      format: "<gradient:#FFE259:#FFA751:#FF4E00:#C70000>☄ <player> llegó envuelto en llamas.</gradient>"
    water:
      name: "<gradient:#00F2FE:#0072FF>Agua</gradient>"
      format: "<gradient:#00F2FE:#00C6FF:#0072FF>≈ <player> surgió de las profundidades del océano.</gradient>"
    rainbow:
      name: "<rainbow>Arcoíris</rainbow>"
      format: "<rainbow>✦ <player> trajo color al servidor ✦</rainbow>"
    event:
      name: "<gold>Evento"
      seasons:
        christmas:
          from: "11-15"
          to: "01-06"
          format: "<red>❄</red> <gradient:#FF3B3B:#FFFFFF:#2ECC40><player> llegó en el trineo de Santa. ¡Feliz Navidad!</gradient> <green>❄</green>"
        halloween:
          from: "10-15"
          to: "11-02"
          format: "<gradient:#FF7518:#8E44AD>☠ <player> salió de su tumba... ¡Feliz Halloween!</gradient>"
    box:
      name: "<red>Boxeo"
      format: "<red><bold>¡DING DING!</bold></red> <white>En esta esquina, con cero derrotas... <gold><bold><player></bold></gold><white>!"
    pc:
      name: "<green>Computadora"
      format: '<dark_gray>[<green>✔</green>]</dark_gray> <green>C:\Voidaris> <white>login <player></white><gray>... conexión establecida.'
    hacker:
      name: "<dark_green>Hacker"
      format: "<dark_green><obfuscated>##</obfuscated></dark_green> <green>Inyectando <white>killaura.jar</white>... <white><player></white> entró con 300 CPS.</green> <dark_green><obfuscated>##</obfuscated></dark_green>"
    void:
      name: "<gradient:#B65CFF:#3A0A6B>Vacío</gradient>"
      format: "<gradient:#B65CFF:#5B1E9E:#3A0A6B>✦ <player> emergió del vacío.</gradient>"
    creeper:
      name: "<green>Creeper"
      format: "<green>Ssss...</green> <red><bold>¡BOOM!</bold></red> <white>Llegó <green><player></green>."
    royal:
      name: "<gradient:#FFD700:#DAA520>Realeza</gradient>"
      format: "<gradient:#FFD700:#FFF3B0:#DAA520>♛ Su majestad <player> ha llegado.</gradient>"

kill-messages:
  # Replace the death message when a player kills another player (requires the death-messages module).
  # Each cosmetic is unlocked with voidaris.cosmetics.killmessage.<id> (give it to ranks in LuckPerms).
  # Players who never picked one, or lost the one they picked, use this cosmetic if they own it, and the
  # translated death message otherwise.
  default-selection: default
  # name: shown in /cosmetics killmessage. format: the kill message; an empty format ("") keeps the translated
  # death message of messages.yml. Placeholders: <killer>, <victim>, <weapon> (the item in the killer's main hand, with its hover)
  # and those of chat-format.yml for the killer (<player>, <displayname>, <prefix_lp>, <suffix_lp>, PlaceholderAPI).
  # seasons: same as in join-messages.
  cosmetics:
    default:
      name: "<white>Predeterminado"
      format: ""
    blade:
      name: "<red>Espadachín"
      format: "<dark_red>⚔</dark_red> <red><victim></red> <gray>cayó ante el filo de</gray> <gold><killer></gold> <gray>con</gray> <weapon>"
    fire:
      name: "<gradient:#FFE259:#FF4E00>Fuego</gradient>"
      format: "<gradient:#FFE259:#FFA751:#FF4E00:#C70000>☄ <killer> redujo a cenizas a <victim>.</gradient>"
    thunder:
      name: "<yellow>Trueno"
      format: "<yellow>⚡</yellow> <white><killer></white> <yellow>fulminó a</yellow> <white><victim></white> <yellow>con la furia de los dioses.</yellow>"
    void:
      name: "<gradient:#B65CFF:#3A0A6B>Vacío</gradient>"
      format: "<gradient:#B65CFF:#5B1E9E:#3A0A6B>✦ <killer> arrastró a <victim> hacia el vacío.</gradient>"
    hacker:
      name: "<dark_green>Hacker"
      format: "<dark_green><obfuscated>##</obfuscated></dark_green> <green><killer> ejecutó</green> <white>rm -rf <victim></white><green>... borrado del sistema.</green> <dark_green><obfuscated>##</obfuscated></dark_green>"
    box:
      name: "<red>Boxeo"
      format: "<red><bold>¡K.O.!</bold></red> <gold><killer></gold> <white>noqueó a</white> <gray><victim></gray> <white>en el primer asalto."
    royal:
      name: "<gradient:#FFD700:#DAA520>Realeza</gradient>"
      format: "<gradient:#FFD700:#FFF3B0:#DAA520>♛ <victim> fue ejecutado por orden de su majestad <killer>.</gradient>"
    event:
      name: "<gold>Evento"
      seasons:
        christmas:
          from: "11-15"
          to: "01-06"
          format: "<red>❄</red> <gradient:#FF3B3B:#FFFFFF:#2ECC40><killer> dejó a <victim> congelado bajo el árbol de Navidad.</gradient> <green>❄</green>"
        halloween:
          from: "10-15"
          to: "11-02"
          format: "<gradient:#FF7518:#8E44AD>☠ <killer> mandó a <victim> de vuelta a su tumba.</gradient>"

teleport-particles:
  # Shown around the player on every teleport (see effects in teleports.yml; the sound is not a cosmetic).
  # Each cosmetic is unlocked with voidaris.cosmetics.teleportparticle.<id>; players with none of them show nothing.
  default-selection: none
  # Each cosmetic draws its layers at the same time (no layers shows nothing). Layer keys:
  #   particle  Bukkit Particle name. DUST and DUST_COLOR_TRANSITION use colors; other particles that need data
  #             (BLOCK, ITEM...) are not supported.
  #   shape     burst (default): count particles around the body at once.
  #             ring: a circle of count points; with duration it rises from the feet to height.
  #             helix: strands spirals rising to height over duration ticks (default 20).
  #   count, spread, speed  amount (per point for helix), box radius and particle speed.
  #   colors    "#RRGGBB" list: DUST cycles them per particle/point/strand, DUST_COLOR_TRANSITION fades first to second.
  #   size, radius, height, duration, strands  dust size, ring/helix radius, final height, ticks, spirals.
  cosmetics:
    none:
      name: "<gray>Ninguna"
      layers: []
    witch:
      name: "<light_purple>Bruja"
      layers:
      - particle: WITCH
        count: 40
        spread: 0.5
        speed: 0.1
    flame:
      name: "<gold>Llamas"
      layers:
      - particle: FLAME
        count: 30
        spread: 0.4
        speed: 0.02
    soul:
      name: "<aqua>Almas"
      layers:
      - particle: SOUL_FIRE_FLAME
        count: 30
        spread: 0.4
        speed: 0.02
    hearts:
      name: "<red>Corazones"
      layers:
      - particle: HEART
        count: 10
        spread: 0.6
    end_rod:
      name: "<white>Estelas"
      layers:
      - particle: END_ROD
        count: 30
        spread: 0.5
        speed: 0.05
    totem:
      name: "<yellow>Tótem"
      layers:
      - particle: TOTEM_OF_UNDYING
        count: 40
        spread: 0.5
        speed: 0.3
    cherry:
      name: "<light_purple>Cerezo"
      layers:
      - particle: CHERRY_LEAVES
        count: 30
        spread: 0.7
    notes:
      name: "<green>Notas"
      layers:
      - particle: NOTE
        count: 12
        spread: 0.6
        speed: 1.0
    spark:
      name: "<yellow>Chispas"
      layers:
      - particle: ELECTRIC_SPARK
        count: 30
        spread: 0.5
        speed: 0.1
    christmas:
      name: "<gradient:#FF3B3B:#FFFFFF:#2ECC40>Navidad</gradient>"
      layers:
      - particle: DUST
        shape: "helix"
        colors: ["#D42426", "#FFFFFF", "#1E8C3A"]
        strands: 3
        size: 1.4
        radius: 0.8
        height: 2.2
        duration: 24
      - particle: SNOWFLAKE
        count: 30
        spread: 0.6
        speed: 0.02
      - particle: DUST
        shape: "ring"
        colors: ["#FFD700"]
        count: 24
        radius: 1.0
        height: 0.1
        size: 1.2
    space:
      name: "<gradient:#B65CFF:#4B6CB7:#1E3A8A>Espacio</gradient>"
      layers:
      - particle: DUST_COLOR_TRANSITION
        shape: "helix"
        colors: ["#7B2FF7", "#1E3A8A"]
        strands: 2
        size: 1.5
        radius: 0.9
        height: 2.2
        duration: 24
      - particle: DUST
        shape: "ring"
        colors: ["#B65CFF", "#4B6CB7", "#0B0B3B", "#FFFFFF"]
        count: 36
        radius: 1.3
        height: 2.2
        duration: 20
      - particle: END_ROD
        count: 20
        spread: 0.8
        speed: 0.02
    halloween:
      name: "<gradient:#FF7518:#8E44AD>Halloween</gradient>"
      layers:
      - particle: DUST
        shape: "helix"
        colors: ["#FF7518", "#8E44AD"]
        strands: 2
        size: 1.4
        radius: 0.8
        height: 2.2
        duration: 24
      - particle: SOUL
        count: 15
        spread: 0.5
        speed: 0.02
      - particle: DUST
        shape: "ring"
        colors: ["#FF7518"]
        count: 24
        radius: 1.0
        height: 0.1
        size: 1.2
    rainbow:
      name: "<rainbow>Arcoíris</rainbow>"
      layers:
      - particle: DUST
        shape: "helix"
        colors: ["#FF0000", "#FF7F00", "#FFFF00", "#00FF00", "#0000FF", "#8B00FF"]
        strands: 6
        size: 1.2
        radius: 0.8
        height: 2.2
        duration: 20
    void:
      name: "<gradient:#B65CFF:#5B1E9E:#3A0A6B>Vacío</gradient>"
      layers:
      - particle: DUST_COLOR_TRANSITION
        shape: "ring"
        colors: ["#B65CFF", "#3A0A6B"]
        count: 30
        radius: 1.0
        height: 2.2
        duration: 20
        size: 1.3
      - particle: DUST
        colors: ["#B65CFF", "#5B1E9E", "#3A0A6B"]
        count: 45
        spread: 0.6
      - particle: WITCH
        count: 20
        spread: 0.5
        speed: 0.1

auras:
  # A trail drawn behind the player while they move (not when standing still, in spectator or invisible;
  # vanished players are hidden as usual). Seen by every player within 32 blocks who can see the wearer.
  # Each cosmetic is unlocked with voidaris.cosmetics.aura.<id>; players with none of them show nothing.
  default-selection: none
  # name: shown in /cosmetics aura. premium: true adds premium_lore of guis/auras.yml to its icon.
  # interval: ticks between two frames while moving (default 2); higher is subtler.
  # layers: same keys as teleport-particles, but only these shapes:
  #   trail  count particles at the feet (raised by height, default 0.3); DUST picks a random color of colors each frame.
  #   orbit  strands points circling the player at height (default 1), radius away, one turn every duration ticks (default 40).
  # seasons: optional layers that replace layers between two dates (MM-dd, inclusive, may wrap around the new year).
  # The first active season wins; an aura with no active season and no layers cannot be equipped or shown.
  cosmetics:
    none:
      name: "<gray>Ninguna"
      layers: []
    cloud:
      name: "<white>Nube"
      layers:
      - particle: CLOUD
        shape: "trail"
        count: 2
        spread: 0.12
        speed: 0.01
    flame:
      name: "<gold>Llama"
      layers:
      - particle: FLAME
        shape: "trail"
        count: 2
        spread: 0.1
        speed: 0.01
    soul:
      name: "<aqua>Alma"
      layers:
      - particle: SOUL_FIRE_FLAME
        shape: "trail"
        count: 2
        spread: 0.1
        speed: 0.01
    hearts:
      name: "<red>Amor"
      interval: 5
      layers:
      - particle: HEART
        shape: "trail"
        height: 0.6
        spread: 0.2
    notes:
      name: "<green>Melodía"
      interval: 5
      layers:
      - particle: NOTE
        shape: "trail"
        height: 0.6
        spread: 0.2
        speed: 1.0
    totem:
      name: "<yellow>Tótem"
      layers:
      - particle: TOTEM_OF_UNDYING
        shape: "trail"
        count: 3
        spread: 0.15
        speed: 0.1
    cherry:
      name: "<light_purple>Cerezo"
      interval: 3
      layers:
      - particle: CHERRY_LEAVES
        shape: "trail"
        count: 2
        height: 0.8
        spread: 0.3
    lava:
      name: "<red>Lava"
      interval: 4
      layers:
      - particle: LAVA
        shape: "trail"
        spread: 0.1
    emerald:
      name: "<green>Esmeralda"
      layers:
      - particle: HAPPY_VILLAGER
        shape: "trail"
        count: 2
        height: 0.4
        spread: 0.2
    witch:
      name: "<dark_purple>Hechizo"
      layers:
      - particle: WITCH
        shape: "trail"
        count: 3
        height: 0.4
        spread: 0.15
        speed: 0.05
    voidaris:
      name: "<gradient:#B65CFF:#5B1E9E:#3A0A6B>Voidaris</gradient>"
      premium: true
      layers:
      - particle: DUST_COLOR_TRANSITION
        shape: "trail"
        colors: ["#B65CFF", "#3A0A6B"]
        count: 3
        size: 1.5
      - particle: DUST
        shape: "orbit"
        colors: ["#B65CFF", "#7B2FF7"]
        size: 1.1
        strands: 2
        radius: 0.6
        height: 1.0
        duration: 30
    rainbow:
      name: "<rainbow>Arcoíris</rainbow>"
      premium: true
      layers:
      # One layer per color so every frame shows the whole palette.
      - particle: DUST
        shape: "trail"
        colors: ["#FF0000", "#FF7F00", "#FFFF00"]
        count: 2
        size: 1.4
      - particle: DUST
        shape: "trail"
        colors: ["#00FF00", "#0000FF", "#8B00FF"]
        count: 2
        size: 1.4
    galaxy:
      name: "<gradient:#7B2FF7:#4B6CB7:#1E3A8A>Galaxia</gradient>"
      premium: true
      layers:
      - particle: DUST
        shape: "trail"
        colors: ["#7B2FF7", "#4B6CB7", "#1E3A8A", "#FFFFFF"]
        count: 3
        size: 1.4
      - particle: END_ROD
        shape: "orbit"
        strands: 2
        radius: 0.6
        height: 1.1
        duration: 36
    royal:
      name: "<gradient:#FFD700:#DAA520>Realeza</gradient>"
      premium: true
      layers:
      - particle: DUST
        shape: "trail"
        colors: ["#FFD700", "#DAA520"]
        count: 3
        size: 1.4
      # A small crown over the head.
      - particle: DUST
        shape: "orbit"
        colors: ["#FFD700"]
        size: 0.9
        strands: 4
        radius: 0.35
        height: 2.2
        duration: 40
    event:
      name: "<gold>Evento"
      premium: true
      seasons:
        christmas:
          from: "11-15"
          to: "01-06"
          layers:
          - particle: DUST
            shape: "trail"
            colors: ["#D42426", "#FFFFFF", "#1E8C3A"]
            count: 3
            size: 1.4
          - particle: SNOWFLAKE
            shape: "trail"
            count: 2
            height: 0.8
            spread: 0.3
        halloween:
          from: "10-15"
          to: "11-02"
          layers:
          - particle: DUST
            shape: "trail"
            colors: ["#FF7518", "#8E44AD"]
            count: 3
            size: 1.4
          - particle: WITCH
            shape: "orbit"
            strands: 2
            radius: 0.6
            height: 1.0
            duration: 30

join-effects:
  # Played around the player when they join. Each cosmetic is unlocked with voidaris.cosmetics.joineffect.<id>;
  # players with none of them show nothing. Spectators and invisible players never show one.
  default-selection: none
  # Ticks between joining and the effect, so the player's own client has loaded the world.
  delay: 20
  # Only players within this many blocks who can see the joining player (vanish) see the effect and hear its
  # public sounds; nobody else is sent anything.
  range: 32
  # name: shown in /cosmetics joineffect. premium: true adds premium_lore of guis/join-effects.yml to its icon.
  # effects: steps played together; each one may start delay ticks later. Step types and their keys:
  #   lightning  count bolts (visual only, no fire or damage) struck radius blocks around the player, interval ticks
  #              apart. Their thunder is heard by the players who see them.
  #   firework   count rockets launched radius blocks around the player, interval ticks apart, exploding after
  #              flight ticks. shape: ball, ball_large, star, burst or creeper. colors: "#RRGGBB" list, two per
  #              rocket in turn. flicker, trail: true/false. They never deal damage.
  #   items      count items of random materials thrown out of the head over duration ticks, removed lifetime ticks
  #              later; speed scales the throw. Nobody (players, mobs or hoppers) can pick them up.
  #              sound (optional): key, volume, pitch and range (default 12), played with every item for the
  #              players within range blocks, with a slight random pitch like vanilla.
  #   particles  same keys as a teleport-particles layer (burst, ring or helix).
  #   sound      key (e.g. minecraft:entity.generic.explode), volume, pitch. Only the joining player hears it unless
  #              public: true (then everyone within range does).
  # seasons: optional effects that replace effects between two dates (MM-dd, inclusive, may wrap around the new year).
  # The first active season wins; an effect with no active season and no effects cannot be equipped or shown.
  cosmetics:
    none:
      name: "<gray>Ninguno"
      effects: []
    thunder:
      name: "<yellow>Trueno"
      effects:
      - type: lightning
        count: 3
        radius: 3.5
        interval: 10
    firework:
      name: "<gradient:#FF5F6D:#FFC371>Fuegos artificiales</gradient>"
      effects:
      - type: firework
        count: 3
        radius: 1.5
        interval: 8
        flight: 18
        shape: ball_large
        colors: ["#B65CFF", "#FF5F6D", "#FFC371", "#00F2FE"]
        flicker: true
        trail: true
    explosion:
      name: "<red>Explosión"
      effects:
      - type: particles
        particle: EXPLOSION_EMITTER
        count: 1
        spread: 0
      - type: particles
        particle: LARGE_SMOKE
        count: 30
        spread: 0.8
        speed: 0.05
      - type: sound
        key: "minecraft:entity.generic.explode"
        # Heard about 32 blocks away (16 blocks per point of volume).
        volume: 2
        public: true
    colors:
      name: "<rainbow>Colores</rainbow>"
      effects:
      - type: items
        materials: [WHITE_WOOL, ORANGE_WOOL, MAGENTA_WOOL, LIGHT_BLUE_WOOL, YELLOW_WOOL, LIME_WOOL, PINK_WOOL, GRAY_WOOL,
                    LIGHT_GRAY_WOOL, CYAN_WOOL, PURPLE_WOOL, BLUE_WOOL, BROWN_WOOL, GREEN_WOOL, RED_WOOL, BLACK_WOOL]
        count: 16
        duration: 20
        lifetime: 40
        sound:
          key: "minecraft:entity.chicken.egg"
          range: 12
    minerals:
      name: "<aqua>Minerales"
      effects:
      - type: items
        materials: [DIAMOND, EMERALD, GOLD_INGOT, IRON_INGOT, COPPER_INGOT, NETHERITE_INGOT, LAPIS_LAZULI, REDSTONE,
                    COAL, QUARTZ, AMETHYST_SHARD]
        count: 16
        duration: 20
        lifetime: 40
        sound:
          key: "minecraft:entity.chicken.egg"
          range: 12
      - type: particles
        particle: WAX_OFF
        count: 20
        spread: 0.6
      - type: sound
        key: "minecraft:block.amethyst_block.chime"
    discs:
      name: "<light_purple>Discos"
      effects:
      - type: items
        materials: [MUSIC_DISC_13, MUSIC_DISC_CAT, MUSIC_DISC_BLOCKS, MUSIC_DISC_CHIRP, MUSIC_DISC_FAR, MUSIC_DISC_MALL,
                    MUSIC_DISC_MELLOHI, MUSIC_DISC_STAL, MUSIC_DISC_STRAD, MUSIC_DISC_WARD, MUSIC_DISC_11,
                    MUSIC_DISC_WAIT, MUSIC_DISC_PIGSTEP, MUSIC_DISC_OTHERSIDE, MUSIC_DISC_5, MUSIC_DISC_RELIC,
                    MUSIC_DISC_CREATOR, MUSIC_DISC_PRECIPICE]
        count: 12
        duration: 20
        lifetime: 40
        sound:
          key: "minecraft:entity.chicken.egg"
          range: 12
      - type: particles
        particle: NOTE
        count: 12
        spread: 0.7
        speed: 1.0
      - type: particles
        delay: 10
        particle: NOTE
        count: 12
        spread: 0.7
        speed: 1.0
      - type: sound
        key: "minecraft:block.note_block.chime"
    totems:
      name: "<yellow>Tótems"
      effects:
      - type: items
        materials: [TOTEM_OF_UNDYING]
        count: 10
        duration: 20
        lifetime: 40
        sound:
          key: "minecraft:entity.chicken.egg"
          range: 12
      - type: particles
        particle: TOTEM_OF_UNDYING
        count: 60
        spread: 0.6
        speed: 0.5
      - type: sound
        key: "minecraft:item.totem.use"
        volume: 0.6
    voidaris:
      name: "<gradient:#B65CFF:#5B1E9E:#3A0A6B>Voidaris</gradient>"
      premium: true
      effects:
      - type: particles
        particle: DUST_COLOR_TRANSITION
        shape: "helix"
        colors: ["#B65CFF", "#3A0A6B"]
        strands: 3
        size: 1.5
        radius: 0.9
        height: 2.4
        duration: 24
      - type: particles
        particle: REVERSE_PORTAL
        count: 60
        spread: 0.6
        speed: 0.1
      - type: items
        delay: 10
        materials: [AMETHYST_SHARD, ENDER_PEARL, ENDER_EYE, PURPLE_DYE, CHORUS_FRUIT, SHULKER_SHELL]
        count: 12
        duration: 20
        lifetime: 40
        sound:
          key: "minecraft:entity.chicken.egg"
          range: 12
      - type: sound
        key: "minecraft:entity.enderman.teleport"
        pitch: 0.8
    spring:
      name: "<gradient:#FFB7C5:#7BD389>Primavera</gradient>"
      effects:
      - type: items
        materials: [POPPY, DANDELION, BLUE_ORCHID, ALLIUM, AZURE_BLUET, RED_TULIP, ORANGE_TULIP, PINK_TULIP,
                    OXEYE_DAISY, CORNFLOWER, LILY_OF_THE_VALLEY, TORCHFLOWER]
        count: 14
        duration: 20
