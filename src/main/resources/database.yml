# VoidarisCore - MariaDB connection.
# Changes here require a server restart; /voidaris reload does not reopen the connection pool.

config-version: 1

enabled: false

host: localhost
port: 3306
database: voidaris
username: voidaris
password: change-me

pool:
  maximum-size: 10
  minimum-idle: 2
  connection-timeout-ms: 5000
  max-lifetime-ms: 1800000
