    default: false
  voidaris.cosmetics.joinmessage.creeper:
    description: Equip the creeper join message.
    default: false
  voidaris.cosmetics.joinmessage.royal:
    description: Equip the royal join message.
    default: false
  voidaris.cosmetics.teleportparticle.none:
    description: Equip the none teleport particles.
    default: true
  voidaris.cosmetics.teleportparticle.witch:
    description: Equip the witch teleport particles.
    default: false
  voidaris.cosmetics.teleportparticle.flame:
