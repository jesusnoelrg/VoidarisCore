    default: false
  voidaris.cosmetics.teleportparticle.none:
    description: Equip the none teleport particles.
    default: true
  voidaris.cosmetics.teleportparticle.witch:
    description: Equip the witch teleport particles.
    default: false
  voidaris.cosmetics.teleportparticle.flame:
