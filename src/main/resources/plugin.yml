name: VoidarisCore
version: '${version}'
main: club.voidaris.core.VoidarisCore
api-version: '26.3'
authors: [ NoDebuffing ]
description: Plugin núcleo del servidor Voidaris (spawn, tpa, homes, chat, mensajes y más).
website: https://web.voidaris.club
softdepend: [ LuckPerms, PlaceholderAPI ]
libraries:
  - com.zaxxer:HikariCP:${hikariVersion}
  - org.mariadb.jdbc:mariadb-java-client:${mariadbVersion}

permissions:
  voidaris.core.reload:
    description: Reload VoidarisCore configuration files.
    default: op
  voidaris.cosmetics.joinmessage.silent:
    description: Equip the silent join message.
    default: true
  voidaris.cosmetics.joinmessage.default:
    description: Equip the default join message.
    default: false
  voidaris.cosmetics.joinmessage.wizard:
    description: Equip the wizard join message.
    default: false
  voidaris.cosmetics.joinmessage.fire:
    description: Equip the fire join message.
    default: false
  voidaris.cosmetics.joinmessage.water:
    description: Equip the water join message.
    default: false
  voidaris.cosmetics.joinmessage.rainbow:
    description: Equip the rainbow join message.
    default: false
  voidaris.cosmetics.joinmessage.event:
    description: Equip the event join message.
    default: false
  voidaris.cosmetics.joinmessage.box:
    description: Equip the box join message.
    default: false
  voidaris.cosmetics.joinmessage.pc:
    description: Equip the pc join message.
    default: false
  voidaris.cosmetics.joinmessage.hacker:
    description: Equip the hacker join message.
    default: false
  voidaris.cosmetics.joinmessage.void:
    description: Equip the void join message.
    default: false
  voidaris.cosmetics.joinmessage.creeper:
    description: Equip the creeper join message.
    default: false
  voidaris.cosmetics.joinmessage.royal:
    description: Equip the royal join message.
    default: false
