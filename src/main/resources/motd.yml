# VoidarisCore - message of the day (MiniMessage), sent to the player when joining and with /motd.
# Placeholders: <player>, <displayname>, <prefix>, <prefix_lp>, <suffix_lp>, <separator> and PlaceholderAPI.

show-on-join: true

# Strikethrough spaces render as one continuous line.
separator: "<gradient:#3b0764:#a855f7:#3b0764><strikethrough>                                                                </strikethrough></gradient>"

lines:
