# Slots filled with the icons below, in order; extra icons go to the next page.
content_slots: [11, 12, 13, 14, 15, 20, 21, 22, 23, 24, 29, 30, 31, 32, 33, 38, 39, 40, 41, 42]

# Page buttons. disabled replaces a button when there is no page to go to. Placeholders: <page>, <pages>.
pagination:
  previous:
    slot: 26
    material: 'arrow'
    display_name: '<light_purple>« <dark_purple><bold>Página anterior</bold>'
    lore:
    - '<gray>Página <page>/<pages>'
    click_commands:
    - '[sound]ITEM_BOOK_PAGE_TURN'
  next:
    slot: 44
    material: 'arrow'
    display_name: '<dark_purple><bold>Página siguiente</bold> <light_purple>»'
    lore:
    - '<gray>Página <page>/<pages>'
    click_commands:
    - '[sound]ITEM_BOOK_PAGE_TURN'
  disabled:
    material: 'gray_stained_glass_pane'
    display_name: '<gray>No aplica'

# One icon per nick color of cosmetics.yml, as <id>: <material> (a cosmetic missing here is not shown).
# display_name and lore are shared by every icon; premium_lore (premium colors only) and the lore of the icon's
# status are appended below lore, in that order. Placeholders: <cosmetic> (its name in cosmetics.yml),
# <preview> (the player's name written in that color).
nick_colors:
  display_name: '<light_purple>✦ <cosmetic> <light_purple>✦'
  item_flags: [HIDE_ADDITIONAL_TOOLTIP, HIDE_ATTRIBUTES]
  lore:
  - ''
  - '<white> Vista previa:'
  - ' <preview>'
  - ''
  premium_lore:
  - '<gold>★ Color premium'
  - ''
  available_lore:
  - '<green>✔ Click para seleccionar'
  # The selected icon also glows.
  selected_lore:
  - '<yellow>¡Ya tienes seleccionado este color!'
  locked_lore:
  - '<red>✘ No tienes desbloqueado este color'
  # Actions run when equipping an icon, clicking the selected one, or clicking a locked one.
  select_commands:
  - '[sound]ENTITY_EXPERIENCE_ORB_PICKUP'
  selected_commands:
  - '[sound]BLOCK_NOTE_BLOCK_BASS'
  locked_commands:
  - '[sound]ENTITY_VILLAGER_NO'
  icons:
    none: 'barrier'
    black: 'black_dye'
    dark_blue: 'lapis_lazuli'
    dark_green: 'green_dye'
    dark_aqua: 'cyan_dye'
    dark_red: 'redstone'
    dark_purple: 'purple_dye'
    gold: 'gold_ingot'
    gray: 'light_gray_dye'
    dark_gray: 'gray_dye'
    blue: 'blue_dye'
    green: 'lime_dye'
    aqua: 'light_blue_dye'
    red: 'red_dye'
    light_purple: 'magenta_dye'
    yellow: 'yellow_dye'
    white: 'white_dye'
    fire: 'blaze_powder'
    ocean: 'heart_of_the_sea'
    void: 'amethyst_shard'
    rainbow: 'nether_star'
  # Last icon: any hex color, picked by typing /nickcolor #RRGGBB (voidaris.cosmetics.customnickcolor).
  # Clicking it closes the menu and sends cosmetics.nick-color.custom-hint of messages.yml.
  # Placeholders: <color> (the custom color the player has selected, empty otherwise).
  custom:
    material: 'oak_sign'
    display_name: '<light_purple>✦ <gradient:#FF5555:#FFFF55:#55FF55:#55FFFF:#5555FF:#FF55FF>Color personalizado</gradient> <light_purple>✦'
    lore:
    - ''
    - '<white> Muestra tu nombre con cualquier'
    - '<white> color hexadecimal que elijas.'
    - ''
    available_lore:
    - '<green>✔ Click para elegir tu color'
    selected_lore:
    - '<white> Color actual: <color>'
    - ''
    - '<yellow>✔ Click para cambiar tu color'
    locked_lore:
    - '<red>✘ No tienes desbloqueado este color'
    click_commands:
    - '[sound]ENTITY_EXPERIENCE_ORB_PICKUP'
