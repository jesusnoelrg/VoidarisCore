# The player's own badge, written with /badges custom <text> (voidaris.cosmetics.custombadge). The lore of its status
# is appended below lore. Placeholders: <custom_badge> (the badge as shown, empty if the player has none), <max> (the
# limit of characters in cosmetics.yml). Clicking it equips the badge if the player wrote one and wears another;
# otherwise it closes the menu and sends cosmetics.badge.custom-hint of messages.yml.
custom:
  material: 'writable_book'
  display_name: '<light_purple>✦ <gradient:#FF5555:#FFFF55:#55FF55:#55FFFF:#5555FF:#FF55FF>Crea tu insignia</gradient> <light_purple>✦'
  lore:
  - ''
  - '<white> Escribe tu propia insignia'
  - '<white> de hasta <light_purple><max></light_purple> caracteres.'
  - ''
  empty_lore:
  - '<green>✔ Click para crear tu insignia'
  available_lore:
  - '<white> Tu insignia: <custom_badge>'
  - ''
  - '<green>✔ Click para equiparla'
  selected_lore:
  - '<white> Tu insignia: <custom_badge>'
  - ''
  - '<yellow>✔ Click para cambiarla'
  locked_lore:
  - '<red>✘ No tienes desbloqueada esta insignia'
  select_commands:
  - '[sound]ENTITY_EXPERIENCE_ORB_PICKUP'
  click_commands:
  - '[sound]ENTITY_EXPERIENCE_ORB_PICKUP'
  locked_commands:
  - '[sound]ENTITY_VILLAGER_NO'
