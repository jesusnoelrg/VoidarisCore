  'redes-sociales':
    material: basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNGQ0MjMzN2JlMGJkY2EyMTI4MDk3ZjFjNWJiMTEwOWU1YzYzM2MxNzkyNmFmNWZiNmZjMjAwMDAwMTFhZWI1MyJ9fX0=
    slot: 27
    display_name: '<light_purple>✦ <dark_purple><bold>Redes sociales</bold> <light_purple>✦'
    lore:
    - ''
    - '<white> Síguenos en nuestras redes'
    - '<white> sociales, para estar al tanto'
    - '<white> de nuestro servidor.'
    - ''
    - '<green>✔ Click para seleccionar'
    left_click_commands:
    - '[player]redes'
    - '[sound]ENTITY_EXPERIENCE_ORB_PICKUP'
    right_click_commands:
