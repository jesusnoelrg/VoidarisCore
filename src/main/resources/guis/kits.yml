# VoidarisCore - kits menu (/kit, /kits).
# Same layout as the server's DeluxeMenus menus (menu_title, size, items, material, slot/slots, display_name, lore,
# *_click_commands), but texts use MiniMessage. material accepts any item or basehead-<texture> for custom heads;
# glow: true adds the glint.
# Actions: [player] command, [console] command (<player> is the player's name), [message] text, [sound] SOUND, [close].
#
# Layout shared by every menu in guis/ (54 slots):
#   left column  9 18 27 36  navigation sections; the current one says "¡Ya estás en esta sección!"
#                            and has the black "« Seleccionado" pane to its right. 9, 18 and 27 are fixed;
#                            36 (Reglas in the main menu) holds the section specific to the menu
#   right column 17          options (Ajustes)
#                26 / 44     previous / next page ("No aplica" when there is no page)
#                35          close
#   content      11-15 20-24 29-33 38-42

menu_title: '<light_purple>↶ <dark_purple><bold>Kits</bold> <light_purple>↷'
size: 54
# How often the icons are redrawn while the menu is open, so cooldowns count down live (20 ticks = 1 second).
refresh_ticks: 20

# Static items, drawn first.
items:
