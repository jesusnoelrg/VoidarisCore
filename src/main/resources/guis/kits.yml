    material: basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZWExZWNhZDQ1NDkzNzg0ZmE2ZmY3OWNhYjBlYTc5ZDk0ZmQ3YWFlMzg0ZDMyYjA3M2E1MTM2MThiZmI1NDBjMSJ9fX0=
    slot: 9
    display_name: '<light_purple>✦ <dark_purple><bold>Menú principal</bold> <light_purple>✦'
    lore:
    - ''
    - '<white> Aquí se muestra todo el'
    - '<white> contenido del survival,'
    - '<white> echale un vistazo.'
    - ''
    - '<green>✔ Click para seleccionar'
    left_click_commands:
    - '[player]menu'
    - '[sound]ENTITY_EXPERIENCE_ORB_PICKUP'
    right_click_commands:
    - '[player]menu'
    - '[sound]ENTITY_EXPERIENCE_ORB_PICKUP'
  'mensajes-entrada':
    material: 'name_tag'
    slot: 18
    display_name: '<light_purple>✦ <dark_purple><bold>Mensajes de entrada</bold> <light_purple>✦'
    lore:
    - ''
    - '<white> Elige cómo se anuncia'
    - '<white> tu llegada al servidor.'
    - ''
    - '<green>✔ Click para seleccionar'
    left_click_commands:
    - '[player]cosmetics joinmessage'
    - '[sound]ENTITY_EXPERIENCE_ORB_PICKUP'
    right_click_commands:
    - '[player]cosmetics joinmessage'
